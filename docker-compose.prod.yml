# Tutti - Production Docker Compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file extends docker-compose.yml with production-specific settings:
# - Traefik reverse proxy with automatic SSL (Let's Encrypt)
# - Resource limits
# - Logging configuration
# - Security hardening
#
# Prerequisites:
# 1. Copy .env.example to .env and configure all variables
# 2. Point your domain DNS to this server
# 3. Open ports 80 and 443 in firewall

services:
  # ==========================================================================
  # Traefik Reverse Proxy
  # ==========================================================================
  traefik:
    image: traefik:v3.0
    container_name: tutti-traefik
    command:
      # API and dashboard
      - '--api.dashboard=true'
      - '--api.insecure=false'
      # Docker provider
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.docker.network=tutti-network'
      # Entrypoints
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      # HTTP to HTTPS redirect
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      # Let's Encrypt
      - '--certificatesresolvers.letsencrypt.acme.tlschallenge=true'
      - '--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
      # Logging
      - '--log.level=INFO'
      - '--accesslog=true'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - tutti-network
    labels:
      # Dashboard
      - 'traefik.enable=true'
      - 'traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)'
      - 'traefik.http.routers.traefik.entrypoints=websecure'
      - 'traefik.http.routers.traefik.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.traefik.service=api@internal'
      - 'traefik.http.routers.traefik.middlewares=auth'
      # Basic auth for dashboard (generate with: htpasswd -nb admin password)
      - 'traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ==========================================================================
  # Backend API - Production overrides
  # ==========================================================================
  backend:
    container_name: tutti-backend
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=warn
    networks:
      - tutti-network
    labels:
      - 'traefik.enable=true'
      # API routing
      - 'traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)'
      - 'traefik.http.routers.backend.entrypoints=websecure'
      - 'traefik.http.routers.backend.tls.certresolver=letsencrypt'
      - 'traefik.http.services.backend.loadbalancer.server.port=3001'
      # Rate limiting
      - 'traefik.http.middlewares.backend-ratelimit.ratelimit.average=100'
      - 'traefik.http.middlewares.backend-ratelimit.ratelimit.burst=50'
      - 'traefik.http.routers.backend.middlewares=backend-ratelimit'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ==========================================================================
  # Frontend - Production overrides
  # ==========================================================================
  frontend:
    container_name: tutti-frontend
    ports: [] # Remove direct port exposure, use Traefik
    networks:
      - tutti-network
    labels:
      - 'traefik.enable=true'
      # Frontend routing
      - 'traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)'
      - 'traefik.http.routers.frontend.entrypoints=websecure'
      - 'traefik.http.routers.frontend.tls.certresolver=letsencrypt'
      - 'traefik.http.services.frontend.loadbalancer.server.port=80'
      # Security headers
      - 'traefik.http.middlewares.frontend-headers.headers.frameDeny=true'
      - 'traefik.http.middlewares.frontend-headers.headers.contentTypeNosniff=true'
      - 'traefik.http.middlewares.frontend-headers.headers.browserXssFilter=true'
      - 'traefik.http.middlewares.frontend-headers.headers.stsSeconds=31536000'
      - 'traefik.http.middlewares.frontend-headers.headers.stsIncludeSubdomains=true'
      - 'traefik.http.routers.frontend.middlewares=frontend-headers'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

# =============================================================================
# Networks
# =============================================================================
networks:
  tutti-network:
    name: tutti-network
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  traefik-letsencrypt:
    name: tutti-letsencrypt
