name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci --workspace=backend

      - name: Type check
        run: npx tsc --noEmit --project backend/tsconfig.json

      # Coverage thresholds are enforced by vitest itself (see backend/vitest.config.ts);
      # this step fails when coverage drops below the configured thresholds.
      - name: Run tests with coverage
        run: npm test --workspace=backend -- --coverage --reporter=json --outputFile=coverage/test-results.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./backend/coverage
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci --workspace=frontend

      - name: Type check
        run: npx tsc --noEmit --project frontend/tsconfig.json

      # Coverage thresholds are enforced by vitest itself (see frontend/vitest.config.ts).
      - name: Run tests with coverage
        run: npm test --workspace=frontend -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./frontend/coverage
          flags: frontend
          fail_ci_if_error: false

      - name: Build
        run: npm run build --workspace=frontend

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The lint script lives in the workspace root and covers backend/src and frontend/src.
      - name: Lint (ESLint)
        run: npm run lint

      # NOTE: a repo-wide `npx prettier --check .` currently fails on ~550 files
      # (the codebase has never been prettier-formatted). Run `npx prettier --write .`
      # once and then enable this step:
      # - name: Format check (Prettier)
      #   run: npx prettier --check .

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Audit dependencies
        run: npm audit --audit-level=critical

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: tutti-backend:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: tutti-frontend:test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Validate compose files
        env:
          JWT_SECRET: ci-dummy-secret
          ADMIN_INIT_PASSWORD: ci-dummy-password
          ACME_EMAIL: ci@example.com
          DOMAIN: example.com
          TRAEFIK_DASHBOARD_AUTH: 'admin:dummy'
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
