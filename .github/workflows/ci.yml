name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --workspace=backend

      - name: Type check
        run: npx tsc --noEmit --project backend/tsconfig.json

      # Coverage thresholds are enforced by vitest itself (see backend/vitest.config.ts);
      # this step fails when coverage drops below the configured thresholds.
      - name: Run tests with coverage
        run: npm test --workspace=backend -- --coverage --reporter=json --outputFile=coverage/test-results.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./backend/coverage
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --workspace=frontend

      - name: Type check
        run: npx tsc --noEmit --project frontend/tsconfig.json

      # Coverage thresholds are enforced by vitest itself (see frontend/vitest.config.ts).
      - name: Run tests with coverage
        run: npm test --workspace=frontend -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./frontend/coverage
          flags: frontend
          fail_ci_if_error: false

      - name: Build
        run: npm run build --workspace=frontend

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      # Dedicated E2E database, separate from any dev/prod database.
      # The same path is used for seeding and for the servers that
      # Playwright's webServer config starts (they inherit the env).
      DB_PATH: ${{ github.workspace }}/e2e-data/harmonie-e2e.db
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Seed E2E database
        run: npm run seed:e2e --workspace=backend

      # CI=true limits the project matrix to chromium (see playwright.config.ts)
      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The lint script lives in the workspace root and covers backend/src and frontend/src.
      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npx prettier --check .

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Audit dependencies
        run: npm audit --audit-level=critical

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: tutti-backend:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: tutti-frontend:test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Validate compose files
        env:
          JWT_SECRET: ci-dummy-secret
          ADMIN_INIT_PASSWORD: ci-dummy-password
          ACME_EMAIL: ci@example.com
          DOMAIN: example.com
          TRAEFIK_DASHBOARD_AUTH: 'admin:dummy'
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    env:
      DB_PATH: ${{ github.workspace }}/lighthouse-data/tutti.db
      JWT_SECRET: lighthouse-only-secret-not-used-anywhere-else
      FRONTEND_URL: http://localhost:3001
      NODE_ENV: production
      PORT: '3001'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # De backend serveert in productiemodus zelf de gebouwde frontend, en
      # `npm start` draait eerst de migraties. Dat is dezelfde opzet als de
      # Docker-image, dus meten we wat er ook echt draait - niet een
      # ontwikkelserver met onverkleinde bestanden.
      - name: Start de applicatie
        run: |
          mkdir -p "$(dirname "$DB_PATH")"
          npm start &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3001/api/health; then
              echo "applicatie draait"
              exit 0
            fi
            sleep 2
          done
          echo "applicatie kwam niet omhoog"
          exit 1

      - name: Lighthouse
        run: node scripts/lighthouse-check.mjs http://localhost:3001/

      - name: Bewaar het verslag
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          retention-days: 7
