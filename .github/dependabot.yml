version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'patch'
      # Majors werden hiervoor categorisch genegeerd. Daardoor kwam er nooit
      # een PR voor kwetsbaarheden die alleen in een major zijn opgelost, en
      # bleven acht advisories maandenlang onzichtbaar staan. Ze komen nu wel
      # binnen, gebundeld in een eigen PR zodat ze de lijst niet overspoelen
      # en bewust beoordeeld worden.
      major-updates:
        update-types:
          - 'major'
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'ci'

  - package-ecosystem: 'docker'
    directory: '/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore(docker)'
    labels:
      - 'docker'
