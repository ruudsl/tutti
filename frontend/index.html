    <!--
      De shell staat op het scherm zodra de HTML binnen is; React vervangt
      hem bij het eerste tekenen. Zonder shell zag de bezoeker een wit scherm
      tot alle JavaScript binnen en uitgevoerd was - op een trage verbinding
      seconden lang. Bewust zonder tekst: dan hoeft hij niet vertaald te
      worden, en een inline SVG telt niet mee als grootste element, zodat
      Lighthouse de LCP aan het echte scherm blijft meten. Zie
      src/__tests__/app-shell.test.ts.
    -->
    <div id="root">
      <div class="app-shell" aria-hidden="true">
        <svg viewBox="0 0 512 512" width="64" height="64" fill="currentColor" focusable="false">
          <path
            d="M256 0C114.6 0 0 114.6 0 256s114.6 256 256 256 256-114.6 256-256S397.4 0 256 0zm0 464c-114.7 0-208-93.3-208-208S141.3 48 256 48s208 93.3 208 208-93.3 208-208 208z"
          />
          <path
            d="M352 128h-32v160c0 8.8-7.2 16-16 16h-96c-8.8 0-16-7.2-16-16V128h-32v160c0 26.5 21.5 48 48 48h96c26.5 0 48-21.5 48-48V128z"
          />
          <circle cx="176" cy="336" r="48" />
          <circle cx="336" cy="336" r="48" />
          <rect x="192" y="96" width="128" height="32" rx="8" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
