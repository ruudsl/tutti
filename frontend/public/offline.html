<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a5276" />
    <title>Offline - Tutti</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      :root {
        --primary-color: #1a5276;
        --primary-light: #2980b9;
        --background: #f5f5f5;
        --surface: #ffffff;
        --text: #333333;
        --text-muted: #666666;
        --border: #e0e0e0;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --primary-color: #2980b9;
          --primary-light: #3498db;
          --background: #1a1a1a;
          --surface: #2d2d2d;
          --text: #f5f5f5;
          --text-muted: #a0a0a0;
          --border: #404040;
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--background);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .container {
        max-width: 480px;
        width: 100%;
        text-align: center;
        background: var(--surface);
        border-radius: 16px;
        padding: 3rem 2rem;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
      }

      .icon {
        width: 80px;
        height: 80px;
        margin-bottom: 1.5rem;
        fill: var(--primary-color);
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.75rem;
        color: var(--text);
      }

      p {
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }

      .status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        background: var(--background);
        border-radius: 8px;
        margin-bottom: 1.5rem;
        font-size: 0.875rem;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e74c3c;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .status.online .status-dot {
        background: #27ae60;
        animation: none;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      button {
        padding: 0.875rem 1.5rem;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .primary-btn {
        background: var(--primary-color);
        color: white;
      }

      .primary-btn:hover {
        background: var(--primary-light);
        transform: translateY(-1px);
      }

      .secondary-btn {
        background: transparent;
        color: var(--primary-color);
        border: 2px solid var(--border);
      }

      .secondary-btn:hover {
        border-color: var(--primary-color);
        background: var(--background);
      }

      .info {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
        font-size: 0.875rem;
        color: var(--text-muted);
      }

      .info ul {
        list-style: none;
        margin-top: 0.75rem;
      }

      .info li {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin: 0.5rem 0;
      }

      .info li svg {
        width: 16px;
        height: 16px;
        fill: #27ae60;
      }

      .hidden {
        display: none;
      }

      .logo {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--primary-color);
        margin-bottom: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .logo svg {
        width: 32px;
        height: 32px;
        fill: var(--primary-color);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
        </svg>
        Tutti
      </div>

      <!-- Offline Icon -->
      <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L18.18 13.8 23.64 7zM21.61 1.61L1.39 21.83 2.8 23.24l3.38-3.38C7.87 20.57 9.86 21 12 21c6.67 0 11.14-3.64 11.6-4 .22-.17.36-.42.36-.72 0-.3-.14-.55-.35-.73l-2.79-2.13 1.79-1.79 2.37 1.81c.48.38.75.94.75 1.54 0 .62-.29 1.21-.79 1.6-.63.5-5.55 4.42-12.94 4.42-2.51 0-4.78-.51-6.67-1.24l-2.32 2.32 1.41 1.41L21.61 3.02l-1.41-1.41zM12 5c1.38 0 2.67.18 3.86.47l-1.76 1.76C13.5 7.08 12.77 7 12 7c-4.29 0-7.36 1.79-8.82 2.73l-1.3-1.01C3.18 7.82 7.05 5 12 5z"
        />
      </svg>

      <h1>Je bent offline</h1>
      <p>Het lijkt erop dat je geen internetverbinding hebt. Sommige functies zijn mogelijk niet beschikbaar.</p>

      <div class="status" id="connection-status">
        <span class="status-dot"></span>
        <span id="status-text">Geen verbinding</span>
      </div>

      <div class="actions">
        <button class="primary-btn" onclick="tryReconnect()">Opnieuw proberen</button>
        <button class="secondary-btn" onclick="goBack()">Terug naar app</button>
      </div>

      <div class="info">
        <p>Met offline modus kun je nog steeds:</p>
        <ul>
          <li>
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" /></svg>
            Eerder bekeken bladmuziek openen
          </li>
          <li>
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" /></svg>
            Je favorieten bekijken
          </li>
          <li>
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" /></svg>
            Gecachte repetities inzien
          </li>
        </ul>
      </div>
    </div>

    <script>
      // Update connection status
      function updateStatus() {
        const statusEl = document.getElementById('connection-status');
        const textEl = document.getElementById('status-text');

        if (navigator.onLine) {
          statusEl.classList.add('online');
          textEl.textContent = 'Verbonden';
          // Auto-redirect after a short delay when back online
          setTimeout(() => {
            window.location.href = '/';
          }, 1000);
        } else {
          statusEl.classList.remove('online');
          textEl.textContent = 'Geen verbinding';
        }
      }

      // Try to reconnect
      function tryReconnect() {
        updateStatus();
        if (navigator.onLine) {
          window.location.href = '/';
        } else {
          // Show brief feedback
          const btn = event.target;
          btn.textContent = 'Verbinden...';
          setTimeout(() => {
            btn.textContent = 'Opnieuw proberen';
            updateStatus();
          }, 1500);
        }
      }

      // Go back to the app (will use cached content)
      function goBack() {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = '/';
        }
      }

      // Listen for online/offline events
      window.addEventListener('online', updateStatus);
      window.addEventListener('offline', updateStatus);

      // Initial status check
      updateStatus();

      // Register for push notifications when online
      if ('serviceWorker' in navigator && 'PushManager' in window) {
        // Service worker is available
      }
    </script>
  </body>
</html>
