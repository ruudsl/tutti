# Cache-Control voor de bestanden met een hash in hun naam. Via een map, en
# niet met add_header in een eigen location: een add_header in een location
# vervangt álle add_header-regels van de server, en dan kregen juist de
# scripts de beveiligingskoppen hieronder niet meer mee.
map $uri $tutti_cache_control {
    ~^/(api|socket\.io)/ "";
    ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ "public, immutable";
    default "";
}

# Het toegangslogboek zonder querystring en zonder Referer. Een link om het
# wachtwoord te herstellen (/reset-password?token=…) en een agenda-abonnement
# (/api/calendar/feed/…?token=…) dragen hun token in de URL; het standaard-
# formaat schreef dat token weg, via de verzoekregel of via de Referer.
# Het pad komt uit $request_uri en niet uit $uri: die laatste is na try_files
# voor elke pagina /index.html. Een uitnodiging en een kaartje dragen hun code
# in het pad; die gaat eruit, net als in backend/src/logging/requestLogger.ts.
map $request_uri $tutti_pad {
    ~^(?<voor>/api/multi-association/invitations/accept/)[^/?]+ "${voor}[weggelaten]";
    ~^(?<voor>/api/tickets/)(?!webhooks(?:/|\?|$))[^/?]+(?<na>/validate)?(?:\?|$) "${voor}[weggelaten]${na}";
    ~^(?<pad>[^?]*) $pad;
}
log_format tutti '$remote_addr - $remote_user [$time_local] "$request_method $tutti_pad $server_protocol" '
                 '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log tutti;

    # Beveiligingskoppen voor de applicatie. De HTML komt van nginx, niet van
    # Express, dus zonder deze regels had de pagina geen CSP. De tekst is die
    # van backend/src/middleware/beveiligingskoppen.ts (cspVoorHosting('nginx'));
    # backend/src/__tests__/beveiligingskoppen-hosting.test.ts vergelijkt ze.
    # Zonder upgrade-insecure-requests: deze server draait ook op
    # http://localhost:5173 en in een thuisnetwerk zonder TLS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com https://alcdn.msauth.net https://apis.google.com https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://hcaptcha.com https://*.hcaptcha.com; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://accounts.google.com https://docs.google.com https://login.microsoftonline.com https://hcaptcha.com https://*.hcaptcha.com; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://www.googleapis.com https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=(), display-capture=()" always;
    add_header Cache-Control $tutti_cache_control;

    # SPA routing - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Realtime (chat, meldingen, opstelling). De browser verbindt met dezelfde
    # server als de pagina; zonder dit blok belandde /socket.io in de
    # SPA-terugval hierboven en kwam er nooit een verbinding.
    location /socket.io/ {
        proxy_pass http://backend:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Cache static assets (Cache-Control staat in de map bovenaan)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
    }
}
