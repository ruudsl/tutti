# Tutti - Development Docker Compose
# Usage: docker compose up --build

services:
  # ==========================================================================
  # Backend API
  # ==========================================================================
  backend:
    # Met image én build erbij kun je kiezen. `docker compose up` haalt de
    # gepubliceerde image op, zodat zelf-hosten geen bouwomgeving vraagt;
    # `docker compose build` bouwt hem alsnog lokaal en zet dezelfde naam
    # erop. Zet de naam vast op een versie in plaats van latest als je wilt
    # weten wat er draait.
    image: ghcr.io/ruudsl/tutti-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Alleen op de machine zelf. De backend vertrouwt één proxy (TRUST_PROXY),
    # en een verzoek dat daar langs gaat mag zelf zeggen welk adres het heeft:
    # van buitenaf rechtstreeks op 3001 omzeil je daarmee de IP-witlijst. De
    # browser komt via nginx (/api) binnen; localhost:3001 blijft voor wie op
    # de server zelf zit.
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      # Persistent data volumes
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRES_IN=7d
      - DB_PATH=/app/data/tutti.db
      - UPLOAD_DIR=/app/uploads
      - FRONTEND_URL=http://localhost:5173
      - ADMIN_INIT_PASSWORD=${ADMIN_INIT_PASSWORD:-}
      - LOG_LEVEL=info
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # Frontend (nginx)
  # ==========================================================================
  frontend:
    image: ghcr.io/ruudsl/tutti-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=/api
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

# =============================================================================
# Volumes
# =============================================================================
volumes:
  backend-data:
    name: tutti-data
  backend-uploads:
    name: tutti-uploads
