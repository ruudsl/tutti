# Render Infrastructure as Code - https://render.com/docs/infrastructure-as-code
#
# Deployment stappen:
# 1. Ga naar https://dashboard.render.com
# 2. Klik op "New" → "Web Service"
# 3. Connect je GitHub repository
# 4. Selecteer de repository en kies "backend" als Root Directory
# 5. Render detecteert automatisch deze render.yaml
#
# Of handmatig:
# 1. New → Web Service → Connect repo
# 2. Root Directory: backend
# 3. Build Command: npm install && npm run build
# 4. Start Command: npm start
# 5. Voeg Environment Variables toe (zie onder)
# 6. Voeg een Disk toe: /opt/render/project/data (1 GB)

services:
  - type: web
    name: harmonie-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/data/harmonie.db
      - key: UPLOAD_DIR
        value: /opt/render/project/data/uploads
      - key: MP3_UPLOAD_DIR
        value: /opt/render/project/data/uploads/mp3
      - key: FRONTEND_URL
        sync: false  # Set this manually in Render dashboard after deploying frontend
    disk:
      name: harmonie-data
      mountPath: /opt/render/project/data
      sizeGB: 1
